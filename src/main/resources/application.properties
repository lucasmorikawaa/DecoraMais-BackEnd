api.security.token.secret=${JWT_SECRET:minha-chave-secreta-super-segura-para-o-tg-decoramais-123456}

spring.application.name=decoramais-backend
spring.datasource.url=jdbc:h2:mem:base_de_dados;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=123

# Habilita o console H2
spring.h2.console.enabled=true

# Hibernate ddl-auto
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Força o Hibernate a gerar o schema ANTES do data.sql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always